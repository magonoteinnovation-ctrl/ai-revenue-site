name: Link check
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required pages
        run: |
          test -f index.html
          test -f article-list.html
          test -f sitemap.xml
          test -f unwanted-items-guide.html
