name: 公式資料から記事を自動更新
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'site-support.css'
      - 'readability.css'
      - '*.png'
      - 'robots.txt'
      - 'articles.json'
      - 'articles/**'
      - 'scripts/**'
      - '.github/workflows/update-articles.yml'
  schedule:
    - cron: '17 23 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-articles
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 自動更新と記事一覧の検証
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: 無料枠を確認して記事を生成
        if: github.event_name != 'push'
        id: generate
        # 資料サイトやAPIの一時障害で、既存記事の公開まで止めない（失敗は警告として残す）
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
        run: python scripts/update_articles.py
      - name: 記事生成の失敗を警告
        if: steps.generate.outcome == 'failure'
        run: |
          git checkout -- articles articles.json automation-state.json 2>/dev/null || true
          # 生成途中で作られた未登録の記事ファイルも取り除き、公開・保存の対象にしない
          git clean -fdq -- articles
          echo "::warning::記事生成に失敗したため、既存記事のまま公開します。ログを確認してください。"
      - name: 記事一覧と検索用サイトマップを更新
        run: python scripts/build_publication.py
      - name: 公開前にリンクを検証
        run: python scripts/check_publication.py
      - name: Wix公式サイトへのリンクを検証
        run: |
          for page in index.html article-list.html contact.html; do
            grep -Fq 'https://magonote-innovation.wixsite.com/benriya' "$page" || { echo "公式サイトへのリンクがありません: $page"; exit 1; }
          done
      - name: 検証済みの記事を保存
        run: |
          # 新しいページやCSS・画像を追加しても保存漏れがないよう、公開対象をまとめて指定する
          git add -A -- articles.json automation-state.json sitemap.xml ':(glob)*.html' ':(glob)*.css' ':(glob)*.png'
          if [ -d articles ]; then git add -A -- articles; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "公式資料を確認して記事を更新"
          # 連続pushで先に別のコミットが入っていても失敗しないよう、取り込んでから保存する
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              git push && exit 0
            else
              # 取り込みで競合した場合は途中状態を残さずに戻してから再試行する
              git rebase --abort 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::mainへの保存に失敗しました。後から入ったmainの更新による公開処理で、生成ファイルは作り直されます。"
          exit 1
      - name: 公開用ファイルだけを準備
        run: |
          mkdir -p _site
          # 公開対象：トップ直下のHTML・CSS・画像・一覧データと articles/ 以下（Markdownや scripts は公開しない）
          cp ./*.html ./*.css articles.json sitemap.xml _site/
          for f in ./*.png; do [ -e "$f" ] && cp "$f" _site/; done
          # 検索エンジン向けの robots.txt も公開する（サイトマップの場所を伝える）
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          if [ -d articles ]; then cp -R articles _site/; fi
          test -f _site/index.html && test -f _site/readability.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: サイトを公開
        uses: actions/deploy-pages@v4
        id: deployment
