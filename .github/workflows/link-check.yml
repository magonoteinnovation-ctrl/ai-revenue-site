name: Link check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run publication tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build publication
        run: python3 scripts/build_publication.py
      - name: Check required pages
        run: |
          test -f index.html
          test -f article-list.html
          test -f sitemap.xml
          test -f unwanted-items-guide.html
      - name: Check internal links and anchors
        run: python3 scripts/check_publication.py
      - name: Check official business site navigation
        run: |
          for page in index.html article-list.html contact.html; do
            grep -Fq 'https://magonote-innovation.wixsite.com/benriya' "$page" || { echo "公式サイトへのリンクがありません: $page"; exit 1; }
          done
